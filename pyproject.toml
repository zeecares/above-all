[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "above-all"
version = "0.1.0"
description = "A provider-neutral personal assistant control plane"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "pydantic>=2.5", "opentelemetry-api>=1.26", "opentelemetry-sdk>=1.26", "tomli>=2.0; python_version < '3.11'"]

[project.scripts]
above-all = "above_all.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/above_all"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "above_all/config"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
ignore = ["UP017"]
